[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-transaction-monitoring"
version = "0.1.0"
description = "Portfolio AML analytics project: transaction monitoring, risk scoring, false-positive optimization, and dashboarding."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "plotly>=5.24",
  "streamlit>=1.39",
  "duckdb>=1.1",
  "pyarrow>=17.0",
  "kagglehub>=0.3",
  "matplotlib>=3.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
