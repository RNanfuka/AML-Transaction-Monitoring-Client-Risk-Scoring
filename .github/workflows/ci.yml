name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/generate_demo_data.py
      - run: python scripts/train_model.py --data data/raw/demo_ibm_aml.csv --max-train-rows 5000 --max-test-rows 2000 --target-recall 0.80
